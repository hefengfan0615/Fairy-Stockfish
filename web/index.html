<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Mini Xiangqi - AI 模式</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <h1>Mini Xiangqi <span class="subtitle">AI 对战</span></h1>
  <div class="status-bar">
    <div id="status" class="status-loading">引擎加载中...</div>
  </div>
  <div id="board-container">
    <div id="board-display" class="board-display"></div>
  </div>
  <div class="board-info">
    <span id="info-fen">FEN: -</span>
    <span id="info-turn">红方走子</span>
    <span id="info-moves">着法: 0</span>
  </div>
  <div class="engine-analysis" id="engine-analysis">
    <div class="analysis-header">引擎分析</div>
    <div class="analysis-stats" id="analysis-stats">等待开局...</div>
    <div class="analysis-pv" id="analysis-pv"></div>
  </div>
  <div class="bottom-controls">
    <button id="btn-undo" class="btn btn-undo" disabled>悔棋</button>
    <button id="btn-flip" class="btn btn-flip">翻转</button>
    <button id="btn-new-game" class="btn btn-new-game">新局</button>
  </div>
</div>
<script src="ffish.js"></script>
<script src="script.js"></script>
</body>
</html>
