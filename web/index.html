<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Xiangqi - 迷你象棋引擎分析</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <div class="header">
    <h1>Mini Xiangqi <span class="sub">迷你象棋</span></h1>
    <div class="status-bar">
      <span id="status" class="status-loading">⏳ 加载引擎中...</span>
      <span id="turn-indicator"></span>
    </div>
  </div>
  <div class="main">
    <div class="board-panel">
      <div id="board" class="board"></div>
      <div class="board-footer">
        <span id="fen-display" class="fen-text">FEN: -</span>
      </div>
    </div>
    <div class="engine-panel">
      <div class="panel-header">
        <h2>引擎分析</h2>
        <div class="engine-controls">
          <button id="btn-newgame" class="btn">新游戏</button>
          <button id="btn-undo" class="btn">悔棋</button>
          <button id="btn-flip" class="btn">翻转</button>
        </div>
      </div>
      <div class="move-history">
        <h3>走棋记录</h3>
        <div id="moves" class="moves-list"></div>
      </div>
      <div class="analysis-output">
        <h3>分析输出</h3>
        <pre id="output" class="output-text">等待引擎启动...</pre>
      </div>
    </div>
  </div>
</div>
<script>
  // Global module reference for UCI communication
  let Module = undefined;
</script>
<script src="ffish.js"></script>
<script src="script.js"></script>
</body>
</html>
