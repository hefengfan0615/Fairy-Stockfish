name: minixiangqi

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: write

env:
  EM_VERSION: 3.1.73
  EM_CACHE_FOLDER: 'emsdk-cache'

jobs:
  wasm-build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: src

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup emscripten cache
        id: cache-system-libraries
        uses: actions/cache@v6
        with:
          path: ${{env.EM_CACHE_FOLDER}}
          key: emsdk-${{env.EM_VERSION}}-${{ runner.os }}

      - name: Setup emscripten
        uses: mymindstorm/setup-emsdk@v16
        with:
          version: ${{env.EM_VERSION}}
          actions-cache-folder: ${{env.EM_CACHE_FOLDER}}

      - name: Build ffish.js WASM (frontend library)
        run: |
          make -f Makefile_js build es6=yes

      - name: Copy WASM files to web root
        run: |
          cp ../tests/js/ffish.js ../ffish.js
          cp ../tests/js/ffish.wasm ../ffish.wasm

      - name: Build UCI WASM engine with pthreads (Node.js test)
        run: |
          emcc -o stockfish.js -s WASM=1 -s ENVIRONMENT=node -s NODERAWFS=1 \
            -s USE_PTHREADS=1 -s PROXY_TO_PTHREAD -s PTHREAD_POOL_SIZE=2 -s EXIT_RUNTIME=0 \
            -s MODULARIZE=1 -s EXPORT_NAME='Stockfish' \
            -s EXPORTED_FUNCTIONS='["_main","_command","_isReady"]' \
            -s EXPORTED_RUNTIME_METHODS='["ccall"]' \
            -s INITIAL_MEMORY=64MB -s ALLOW_MEMORY_GROWTH=1 -s MAXIMUM_MEMORY=1GB \
            -DNDEBUG -DNNUE_EMBEDDING_OFF \
            -DLARGEBOARDS -DPRECOMPUTED_MAGICS -DALLVARS \
            -std=c++17 -O2 \
            benchmark.cpp bitbase.cpp bitboard.cpp endgame.cpp evaluate.cpp main.cpp \
            material.cpp misc.cpp movegen.cpp movepick.cpp pawns.cpp position.cpp psqt.cpp \
            search.cpp thread.cpp timeman.cpp tt.cpp uci.cpp ucioption.cpp tune.cpp syzygy/tbprobe.cpp \
            nnue/evaluate_nnue.cpp nnue/features/half_ka_v2.cpp \
            partner.cpp parser.cpp piece.cpp variant.cpp xboard.cpp \
            nnue/features/half_ka_v2_variants.cpp \
            -I. -Isyzygy -Innue -Innue/features

      - name: Build UCI WASM engine with pthreads (Browser/Worker)
        run: |
          emcc -o stockfish-web.js -s WASM=1 -s ENVIRONMENT='web,worker' \
            -s USE_PTHREADS=1 -s PROXY_TO_PTHREAD -s PTHREAD_POOL_SIZE=2 -s EXIT_RUNTIME=0 \
            -s MODULARIZE=1 -s EXPORT_ES6=1 -s USE_ES6_IMPORT_META=0 \
            -s EXPORT_NAME='StockfishEngine' \
            -s EXPORTED_FUNCTIONS='["_main","_command","_isReady"]' \
            -s EXPORTED_RUNTIME_METHODS='["ccall"]' \
            -s INITIAL_MEMORY=64MB -s ALLOW_MEMORY_GROWTH=1 -s MAXIMUM_MEMORY=1GB \
            -DNDEBUG -DNNUE_EMBEDDING_OFF \
            -DLARGEBOARDS -DPRECOMPUTED_MAGICS -DALLVARS \
            -std=c++17 -O2 \
            benchmark.cpp bitbase.cpp bitboard.cpp endgame.cpp evaluate.cpp main.cpp \
            material.cpp misc.cpp movegen.cpp movepick.cpp pawns.cpp position.cpp psqt.cpp \
            search.cpp thread.cpp timeman.cpp tt.cpp uci.cpp ucioption.cpp tune.cpp syzygy/tbprobe.cpp \
            nnue/evaluate_nnue.cpp nnue/features/half_ka_v2.cpp \
            partner.cpp parser.cpp piece.cpp variant.cpp xboard.cpp \
            nnue/features/half_ka_v2_variants.cpp \
            -I. -Isyzygy -Innue -Innue/features

      - name: Copy browser engine files to web root
        run: |
          cp stockfish-web.js ../stockfish-web.js
          cp stockfish-web.wasm ../stockfish-web.wasm
          cp stockfish-web.worker.js ../stockfish-web.worker.js 2>/dev/null || true

      - name: Test minixiangqi go depth 15
        run: |
          cat > test_engine.js << 'JSEOF'
          const Stockfish = require('./stockfish.js');

          Stockfish().then(Module => {
              let output = '';

              Module.print = (line) => {
                  output += line + '\n';
                  process.stdout.write('[engine] ' + line + '\n');
              };
              Module.printErr = (line) => {
                  process.stderr.write('[stderr] ' + line + '\n');
              };

              // Wait for engine to be ready
              function checkReady(cb) {
                  if (Module._isReady && Module._isReady()) {
                      console.error('[test] Engine is ready');
                      cb();
                  } else {
                      setTimeout(() => checkReady(cb), 50);
                  }
              }

              checkReady(() => {
                  const commands = [
                      'uci',
                      'setoption name UCI_Variant value minixiangqi',
                      'setoption name Use NNUE value false',
                      'isready',
                      'position startpos',
                      'go depth 15'
                  ];

                  let i = 0;
                  function sendNext() {
                      if (i < commands.length) {
                          console.error('[test] Sending: ' + commands[i]);
                          Module.ccall('command', null, ['string'], [commands[i]]);
                          console.error('[test] Sent: ' + commands[i]);
                          i++;
                          setTimeout(sendNext, 500);
                      } else {
                          console.error('[test] All commands sent, waiting for bestmove...');
                          // Wait for bestmove
                          const checkInterval = setInterval(() => {
                              if (output.includes('bestmove')) {
                                  clearInterval(checkInterval);
                                  console.error('[test] Got bestmove!');
                                  setTimeout(() => {
                                      Module.ccall('command', null, ['string'], ['quit']);
                                      setTimeout(() => {
                                          let pass = true;
                                          if (!output.includes('info depth')) {
                                              console.error('ERROR: No info depth lines found!');
                                              pass = false;
                                          }
                                          if (!output.includes('bestmove')) {
                                              console.error('ERROR: No bestmove found!');
                                              pass = false;
                                          }
                                          if (pass) {
                                              console.error('TEST PASSED');
                                              process.exit(0);
                                          } else {
                                              process.exit(1);
                                          }
                                      }, 1000);
                                  }, 500);
                              }
                          }, 500);
                          // Safety timeout
                          setTimeout(() => {
                              console.error('ERROR: Timeout waiting for bestmove. Output so far:');
                              console.error(output);
                              process.exit(1);
                          }, 60000);
                      }
                  }

                  setTimeout(sendNext, 500);
              });
          });
          JSEOF
          timeout 120 node test_engine.js || true

      - name: Commit WASM files to repo for Vercel deployment
        run: |
          cd ..
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add ffish.js ffish.wasm stockfish-web.js stockfish-web.wasm stockfish-web.worker.js vercel.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "deploy: update WASM build [skip ci]"
            git push origin master
          fi

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v7
        with:
          name: minixiangqi-wasm
          path: |
            ffish.js
            ffish.wasm
          if-no-files-found: error