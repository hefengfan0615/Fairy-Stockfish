name: minixiangqi

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: write

env:
  EM_VERSION: 3.1.73
  EM_CACHE_FOLDER: 'emsdk-cache'

jobs:
  wasm-build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: src

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup emscripten cache
        id: cache-system-libraries
        uses: actions/cache@v6
        with:
          path: ${{env.EM_CACHE_FOLDER}}
          key: emsdk-${{env.EM_VERSION}}-${{ runner.os }}

      - name: Setup emscripten
        uses: mymindstorm/setup-emsdk@v16
        with:
          version: ${{env.EM_VERSION}}
          actions-cache-folder: ${{env.EM_CACHE_FOLDER}}

      - name: Build UCI WASM engine for Browser/Worker
        run: |
          emcc -o stockfish-web.js -s WASM=1 -s ENVIRONMENT='web,worker' \
            -s USE_PTHREADS=1 -s PTHREAD_POOL_SIZE=2 -s EXIT_RUNTIME=0 \
            -s MODULARIZE=1 -s EXPORT_ES6=1 -s USE_ES6_IMPORT_META=0 \
            -s EXPORT_NAME='StockfishEngine' \
            -s EXPORTED_FUNCTIONS='["_main","_command","_isReady"]' \
            -s EXPORTED_RUNTIME_METHODS='["ccall"]' \
            -s INITIAL_MEMORY=64MB -s ALLOW_MEMORY_GROWTH=1 -s MAXIMUM_MEMORY=1GB \
            -DNDEBUG -DNNUE_EMBEDDING_OFF \
            -DLARGEBOARDS -DPRECOMPUTED_MAGICS -DALLVARS \
            -std=c++17 -O2 \
            benchmark.cpp bitbase.cpp bitboard.cpp endgame.cpp evaluate.cpp main.cpp \
            material.cpp misc.cpp movegen.cpp movepick.cpp pawns.cpp position.cpp psqt.cpp \
            search.cpp thread.cpp timeman.cpp tt.cpp uci.cpp ucioption.cpp tune.cpp syzygy/tbprobe.cpp \
            nnue/evaluate_nnue.cpp nnue/features/half_ka_v2.cpp \
            partner.cpp parser.cpp piece.cpp variant.cpp xboard.cpp \
            nnue/features/half_ka_v2_variants.cpp \
            -I. -Isyzygy -Innue -Innue/features

      - name: Build UCI WASM engine for Node.js test
        run: |
          emcc -o stockfish-test.js -s WASM=1 -s ENVIRONMENT=node -s NODERAWFS=1 \
            -s USE_PTHREADS=1 -s PTHREAD_POOL_SIZE=2 -s EXIT_RUNTIME=0 \
            -s MODULARIZE=1 -s EXPORT_NAME='StockfishTest' \
            -s EXPORTED_FUNCTIONS='["_main","_command","_isReady"]' \
            -s EXPORTED_RUNTIME_METHODS='["ccall"]' \
            -s INITIAL_MEMORY=64MB -s ALLOW_MEMORY_GROWTH=1 -s MAXIMUM_MEMORY=1GB \
            -DNDEBUG -DNNUE_EMBEDDING_OFF \
            -DLARGEBOARDS -DPRECOMPUTED_MAGICS -DALLVARS \
            -std=c++17 -O2 \
            benchmark.cpp bitbase.cpp bitboard.cpp endgame.cpp evaluate.cpp main.cpp \
            material.cpp misc.cpp movegen.cpp movepick.cpp pawns.cpp position.cpp psqt.cpp \
            search.cpp thread.cpp timeman.cpp tt.cpp uci.cpp ucioption.cpp tune.cpp syzygy/tbprobe.cpp \
            nnue/evaluate_nnue.cpp nnue/features/half_ka_v2.cpp \
            partner.cpp parser.cpp piece.cpp variant.cpp xboard.cpp \
            nnue/features/half_ka_v2_variants.cpp \
            -I. -Isyzygy -Innue -Innue/features

      - name: Test minixiangqi go depth 20
        run: |
          rm -f /tmp/test_pass /tmp/test_fail
          cat > test_engine.js << 'JSEOF'
          const fs = require('fs');

          let output = '';
          let gotBestmove = false;

          const StockfishTest = require('./stockfish-test.js');
          StockfishTest({
              print: (line) => {
                  output += line + '\n';
                  process.stdout.write('[engine] ' + line + '\n');
                  if (line.includes('bestmove')) {
                      gotBestmove = true;
                      console.error('[test] Got bestmove!');
                      if (output.includes('info depth')) {
                          console.error('TEST PASSED');
                          fs.writeFileSync('/tmp/test_pass', '1');
                      } else {
                          console.error('ERROR: No info depth lines found!');
                          fs.writeFileSync('/tmp/test_fail', '1');
                      }
                  }
              },
              printErr: (line) => {
                  process.stderr.write('[stderr] ' + line + '\n');
              }
          }).then(engine => {
              function waitForReady() {
                  return new Promise((resolve, reject) => {
                      let attempts = 0;
                      const maxAttempts = 200;
                      function check() {
                          attempts++;
                          if (engine._isReady && engine._isReady()) {
                              resolve();
                          } else if (attempts >= maxAttempts) {
                              reject(new Error('Engine initialization timed out'));
                          } else {
                              setTimeout(check, 50);
                          }
                      }
                      check();
                  });
              }

              return waitForReady().then(() => {
                  console.error('[test] Engine is ready');

                  const commands = [
                      'uci',
                      'setoption name UCI_Variant value minixiangqi',
                      'setoption name Use NNUE value true',
                      'setoption name EvalFile value minixiangqi.nnue',
                      'isready',
                      'position startpos',
                      'go depth 20'
                  ];

                  function sendCommand(cmd) {
                      engine.ccall('command', null, ['string'], [cmd]);
                  }

                  let i = 0;
                  function sendNext() {
                      if (i < commands.length) {
                          console.error('[test] Sending: ' + commands[i]);
                          sendCommand(commands[i]);
                          console.error('[test] Sent: ' + commands[i]);
                          i++;
                          setTimeout(sendNext, 500);
                      } else {
                          console.error('[test] All commands sent, waiting for bestmove...');
                      }
                  }

                  setTimeout(sendNext, 500);
              });
          }).catch(err => {
              console.error('ERROR: Module initialization failed:', err);
              fs.writeFileSync('/tmp/test_fail', '1');
          });

          // Safety timeout
          setTimeout(() => {
              if (!gotBestmove) {
                  console.error('ERROR: Timeout waiting for bestmove. Output so far:');
                  console.error(output);
                  fs.writeFileSync('/tmp/test_fail', '1');
              }
          }, 120000);
          JSEOF
          timeout 180 node test_engine.js 2>&1 || true
          if [ -f /tmp/test_pass ]; then
            echo "TEST PASSED"
            exit 0
          else
            echo "TEST FAILED"
            exit 1
          fi

      - name: Copy browser engine files to web root
        run: |
          cp stockfish-web.js ../stockfish-web.js
          cp stockfish-web.wasm ../stockfish-web.wasm
          cp stockfish-web.worker.js ../stockfish-web.worker.js 2>/dev/null || true

      - name: Commit WASM files to repo for Vercel deployment
        run: |
          cd ..
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add stockfish-web.js stockfish-web.wasm stockfish-web.worker.js vercel.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "deploy: update WASM build [skip ci]"
            git push origin master
          fi

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v7
        with:
          name: minixiangqi-wasm
          path: |
            stockfish-web.js
            stockfish-web.wasm
            stockfish-web.worker.js
          if-no-files-found: error