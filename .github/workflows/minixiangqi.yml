name: minixiangqi

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: write

jobs:
  minixiangqi-wasm:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: src

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y expect wget

      - name: Install gdown for Google Drive downloads
        run: |
          sudo apt install -y python3-pip
          pip3 install gdown --break-system-packages

      - name: Download NNUE network if not present
        run: |
          NNUE_FILE="minixiangqi.nnue"
          if [ -f "$NNUE_FILE" ]; then
            echo "NNUE network already exists in repository"
          else
            echo "Downloading NNUE network from Google Drive..."
            python3 -m gdown "https://drive.google.com/u/0/uc?id=1olNzEqMDtqLC7lnt7Rsst39ar1tzsv86" -O "$NNUE_FILE" || \
            wget --no-check-certificate "https://docs.google.com/uc?export=download&id=1olNzEqMDtqLC7lnt7Rsst39ar1tzsv86" -O "$NNUE_FILE"
          fi
          ls -la "$NNUE_FILE"

      - name: Commit NNUE file to repository if newly downloaded
        run: |
          NNUE_FILE="minixiangqi.nnue"
          if git status --porcelain "$NNUE_FILE" | grep -q "??"; then
            echo "NNUE file is new, committing to repository..."
            git config user.name "github-actions"
            git config user.email "github-actions@github.com"
            git add -f "$NNUE_FILE"
            git commit -m "Add minixiangqi NNUE network file"
            git push origin master
          else
            echo "NNUE file already tracked, no commit needed"
          fi

      - name: Setup emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.73

      - name: Verify emscripten installation
        run: |
          emcc --version
          which emcc

      - name: Build WASM CommonJS module for testing
        run: |
          make -f Makefile_js clean
          make -f Makefile_js build nnue=yes
          ls -la ../tests/js/

      - name: Test WASM engine with Node.js
        run: |
          cd ../tests/js
          node -e "
          const ffish = require('./ffish.js');
          ffish['onRuntimeInitialized'] = () => {
            console.log('FFish version:', ffish.info());
            const board = new ffish.Board('minixiangqi');
            console.log('FEN:', board.fen());
            console.log('Legal moves:', board.legalMoves());
            // Test engine search at depth 20
            console.log('Searching at depth 20...');
            const result = board.go(20, 0);
            console.log('Search result:', result);
            board.delete();
            console.log('WASM engine test PASSED');
          };
          "

      - name: Build WASM ES6 module for web deployment
        run: |
          make -f Makefile_js clean
          make -f Makefile_js build es6=yes nnue=yes
          ls -la ../tests/js/

      - name: Create output directory for WASM artifacts
        run: |
          mkdir -p ../wasm-output
          cp ../tests/js/ffish.js ../wasm-output/ffish.js 2>/dev/null || true
          cp ../tests/js/ffish.wasm ../wasm-output/ffish.wasm 2>/dev/null || true
          cp ../tests/js/ffish.data ../wasm-output/ffish.data 2>/dev/null || true
          cp minixiangqi.nnue ../wasm-output/minixiangqi.nnue 2>/dev/null || true
          ls -la ../wasm-output/

      - name: Commit WASM and NNUE artifacts to repository
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          # Add WASM build artifacts (paths relative to repo root, run from src/)
          STAGED=0
          for f in ../tests/js/ffish.js ../tests/js/ffish.wasm ../tests/js/ffish.data; do
            if [ -f "$f" ]; then
              git add -f "$f"
              echo "Staged: $f"
              STAGED=1
            fi
          done
          # Check if there are staged changes to commit
          if [ "$STAGED" = "1" ] && ! git diff --cached --quiet; then
            echo "WASM build artifacts have changes, committing..."
            git commit -m "Update WASM single-threaded engine build with NNUE support"
            git push origin master
          else
            echo "No new WASM artifacts to commit"
          fi