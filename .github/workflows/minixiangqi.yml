name: minixiangqi

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: write

env:
  EM_VERSION: 3.1.73
  EM_CACHE_FOLDER: 'emsdk-cache'

jobs:
  wasm-build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: src

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup emscripten cache
        id: cache-system-libraries
        uses: actions/cache@v6
        with:
          path: ${{env.EM_CACHE_FOLDER}}
          key: emsdk-${{env.EM_VERSION}}-${{ runner.os }}

      - name: Setup emscripten
        uses: mymindstorm/setup-emsdk@v16
        with:
          version: ${{env.EM_VERSION}}
          actions-cache-folder: ${{env.EM_CACHE_FOLDER}}

      - name: Build ffish.js WASM (frontend library)
        run: |
          make -f Makefile_js build es6=yes

      - name: Copy WASM files to web root
        run: |
          cp ../tests/js/ffish.js ../ffish.js
          cp ../tests/js/ffish.wasm ../ffish.wasm

      - name: Build UCI WASM engine with pthreads
        run: |
          emcc -o stockfish.js -s WASM=1 -s ENVIRONMENT=node -s NODERAWFS=1 \
            -s USE_PTHREADS=1 -s PROXY_TO_PTHREAD -s PTHREAD_POOL_SIZE=2 -s EXIT_RUNTIME=1 \
            -s INITIAL_MEMORY=64MB -s ALLOW_MEMORY_GROWTH=1 -s MAXIMUM_MEMORY=1GB \
            -DNNUE_EMBEDDING_OFF \
            -DLARGEBOARDS -DPRECOMPUTED_MAGICS -DALLVARS \
            -std=c++17 -O2 \
            benchmark.cpp bitbase.cpp bitboard.cpp endgame.cpp evaluate.cpp main.cpp \
            material.cpp misc.cpp movegen.cpp movepick.cpp pawns.cpp position.cpp psqt.cpp \
            search.cpp thread.cpp timeman.cpp tt.cpp uci.cpp ucioption.cpp tune.cpp syzygy/tbprobe.cpp \
            nnue/evaluate_nnue.cpp nnue/features/half_ka_v2.cpp \
            partner.cpp parser.cpp piece.cpp variant.cpp xboard.cpp \
            nnue/features/half_ka_v2_variants.cpp \
            -I. -Isyzygy -Innue -Innue/features

      - name: Test minixiangqi go depth 20
        run: |
          timeout 120 node stockfish.js 2>&1 << 'EOF' || true
          uci
          setoption name EvalFile value minixiangqi.nnue
          setoption name Use NNUE value true
          setoption name UCI_Variant value minixiangqi
          isready
          position startpos
          go depth 20
          quit
          EOF

      - name: Commit WASM files to repo for Vercel deployment
        run: |
          cd ..
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add ffish.js ffish.wasm vercel.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "deploy: update WASM build [skip ci]"
            git push origin master
          fi

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v7
        with:
          name: minixiangqi-wasm
          path: |
            ffish.js
            ffish.wasm
          if-no-files-found: error